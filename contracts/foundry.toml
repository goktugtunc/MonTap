[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.31"
evm_version = "osaka"
network = "monad"
optimizer = true
optimizer_runs = 200
via_ir = false
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://api-testnet.monadscan.com/api", chain = 10143 }
monad = { key = "${MONADSCAN_API_KEY}", url = "https://api.monadscan.com/api", chain = 143 }

[lint]
exclude_lints = ["block-timestamp", "unsafe-typecast", "mixed-case-variable", "mixed-case-function", "asm-keccak256"]
