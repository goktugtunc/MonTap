<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.stage{background:radial-gradient(900px 900px at 20% 10%,#a493ff 0%,#836ef9 35%,#4a2fb8 62%,#0b0816 100%)}
.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(700px 600px at 95% 100%,rgba(232,72,170,.75),transparent 65%)}
.gridbg{background-image:linear-gradient(rgba(251,250,249,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(251,250,249,.08) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}
.c{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.dia{font-size:380px;line-height:1;color:var(--white);text-shadow:0 0 80px rgba(251,250,249,.45),0 20px 60px rgba(11,8,22,.5)}
.name{font-size:150px;font-weight:850;letter-spacing:-.04em;color:var(--white);text-shadow:0 10px 40px rgba(11,8,22,.45)}
</style></head><body><div class="stage"><div class="gridbg"></div><div class="c"><div class="dia">◆</div><div class="name">MonTap</div></div></div></body></html>
